<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ratDance</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #renderCanvas { width: 100%; height: 100%; display: block; outline: none; }
      #clickToPlay {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #fff; font: bold 32px monospace; background: rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }
      #clickToPlay.hidden { display: none; }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="clickToPlay">Click para jugar</div>
    <script type="module" src="/src/main.ts"></script>
